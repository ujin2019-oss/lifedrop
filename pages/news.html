<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠페인 소식 — LIFE DROP 헌혈 나눔센터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="news">

<!-- 공통 헤더 -->
<div id="header"></div>

<main>
  <!-- 서브 히어로 -->
  <section class="sub-hero">
    <div class="inner">
      <span class="sub-hero__label">LIFE DROP</span>
      <h2 class="sub-hero__title">캠페인 소식</h2>
      <p class="sub-hero__desc">LIFE DROP 캠페인의 새로운 소식을 전해드립니다.</p>
      <ul class="breadcrumb">
        <li><a href="../index.html">홈</a></li>
        <li class="current">캠페인 소식</li>
      </ul>
    </div>
  </section>

  <!-- 캠페인 소식 게시판 -->
  <section class="sub-content board" id="newsBoard">
    <div class="inner">

      <!-- 상단: 카테고리 탭 + 검색 -->
      <div class="board__top" data-reveal>
        <ul class="board__tabs" id="boardTabs">
          <li><button type="button" class="board__tab is-active" data-cat="all">전체</button></li>
          <li><button type="button" class="board__tab" data-cat="notice">공지사항</button></li>
          <li><button type="button" class="board__tab" data-cat="campaign">캠페인</button></li>
          <li><button type="button" class="board__tab" data-cat="event">이벤트</button></li>
          <li><button type="button" class="board__tab" data-cat="press">보도자료</button></li>
        </ul>
        <form class="board__search" id="boardSearch" role="search" onsubmit="return false;">
          <input type="search" id="boardSearchInput" placeholder="제목·내용 검색" aria-label="소식 검색">
          <button type="submit" aria-label="검색">🔍</button>
        </form>
      </div>

      <!-- 게시글 카드 그리드 -->
      <ul class="news-grid" id="newsGrid" data-reveal></ul>

      <!-- 결과 없음 -->
      <p class="news-empty" id="newsEmpty" hidden>검색 결과가 없습니다.</p>

      <!-- 페이지네이션 -->
      <nav class="pagination" id="newsPagination" aria-label="페이지 이동"></nav>

    </div>
  </section>

  <!-- 게시글 상세 모달 -->
  <div class="news-modal" id="newsModal" aria-hidden="true">
    <div class="news-modal__dim" id="newsModalDim"></div>
    <article class="news-modal__panel" role="dialog" aria-modal="true" aria-labelledby="newsModalTitle">
      <button type="button" class="news-modal__close" id="newsModalClose" aria-label="닫기">×</button>
      <span class="news-card__cat" id="newsModalCat"></span>
      <h3 class="news-modal__title" id="newsModalTitle"></h3>
      <div class="news-modal__meta">
        <span id="newsModalDate"></span>
        <span id="newsModalViews"></span>
      </div>
      <div class="news-modal__thumb" id="newsModalThumb"></div>
      <div class="news-modal__body" id="newsModalBody"></div>
    </article>
  </div>
</main>

<!-- 공통 푸터 -->
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="../include/header.js"></script>
<script src="../include/footer.js"></script>
<script src="../js/include.js"></script>
<script src="../js/main.js"></script>
<script src="../js/news.js"></script>
</body>
</html>
